<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP Config Generator</title>
    <link rel="icon" href="app-past/favicon.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- THEME INITIALIZATION SCRIPT -->
    <script>
        const savedTheme = localStorage.getItem('ispTheme') || 'dark-theme';
        document.documentElement.className = savedTheme;
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    
    <style>
        /* Theme Variables */
        :root.dark-theme {
            --bg-color: #050505;
            --panel-bg: #0b0b0b;
            --border-color: #00ff9c;
            --text-color: #00ff9c;
            --text-muted: #888888;
            --text-secondary: #888888;
            --label-color: #00ff9c;
            --input-bg: #000000;
            --input-border: #333333;
            --output-bg: #000000;
            --copy-bg: rgba(0, 255, 156, 0.1);
            --copy-text: #00ff9c;
            --copy-border: #00ff9c;
            --copy-radius: 4px;
            --copy-hover-bg: rgba(0, 255, 156, 0.2);
            --copy-hover-text: #00ff9c;
            --copy-hover-border: #00ff9c;
            --panel-shadow: 0 4px 6px rgba(0,0,0,0.5);
            --btn-hover-bg: #00ff9c;
            --btn-hover-text: #000000;
            --accent-color: #00ff9c;
            --focus-ring: rgba(0,255,156,0.15);
            --focus-border: #00ff9c;
            --panel-radius: 8px;
            --toggle-off: #888888;
            --toggle-on: #00ff9c;
        }

        :root.light-theme {
            --bg-color: #eef2f6;
            --panel-bg: #ffffff;
            --border-color: #c6ccd2;
            --text-color: #111827;
            --text-muted: #6b7280;
            --text-secondary: #374151;
            --label-color: #6b7280;
            --input-bg: #ffffff;
            --input-border: #c6ccd2;
            --output-bg: #f8fafc;
            --copy-bg: #059669;
            --copy-text: #ffffff;
            --copy-border: #059669;
            --copy-radius: 6px;
            --copy-hover-bg: #047857;
            --copy-hover-text: #ffffff;
            --copy-hover-border: #047857;
            --panel-shadow: 0 2px 8px rgba(0,0,0,0.06);
            --btn-hover-bg: #ffffff;
            --btn-hover-text: #059669;
            --accent-color: #059669;
            --focus-ring: rgba(5,150,105,0.15);
            --focus-border: #059669;
            --panel-radius: 10px;
            --toggle-off: #cbd5e1;
            --toggle-on: #059669;
        }

        /* Core Application Logic */
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--panel-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            opacity: 0.8;
        }
        
        .noc-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--panel-radius);
            padding: 16px;
            box-shadow: var(--panel-shadow);
            transition: background-color 0.3s, border-color 0.3s, border-radius 0.3s;
        }
        
        .noc-input {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        
        .noc-input:focus {
            border-color: var(--focus-border);
            outline: none;
            box-shadow: 0 0 0 2px var(--focus-ring);
        }

        .noc-output-area {
            background-color: var(--output-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        
        .noc-output-area:focus {
            border-color: var(--focus-border);
            outline: none;
            box-shadow: 0 0 0 2px var(--focus-ring);
        }
        
        .noc-label {
            color: var(--label-color);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            margin-bottom: 4px;
            display: block;
        }

        .noc-btn {
            border: 1px solid var(--border-color);
            color: var(--border-color);
            background: transparent;
        }

        .noc-btn.filled {
            background: var(--border-color);
            color: var(--bg-color);
        }

        .noc-btn:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }
        
        .copy-btn {
            background-color: var(--copy-bg);
            color: var(--copy-text);
            border: 1px solid var(--copy-border);
            border-radius: var(--copy-radius);
            font-weight: 600;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background-color: var(--copy-hover-bg);
            color: var(--copy-hover-text);
            border-color: var(--copy-hover-border);
        }

        .text-var-muted { color: var(--text-muted); }
        .text-var-secondary { color: var(--text-secondary); }
        .border-var-color { border-color: var(--border-color); }
        .bg-var-color { background-color: var(--border-color); }

        .noc-inner-box {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
        }

        .text-var-main { color: var(--text-color); }
        .text-var-accent { color: var(--accent-color); fill: var(--accent-color); }

        #toast {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.toast-show {
            opacity: 1;
            visibility: visible;
        }
        
        ::selection {
            background-color: var(--border-color);
            color: var(--bg-color);
        }
    </style>
</head>

<body class="min-h-screen p-4 flex flex-col">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6 px-2">
        <div>
            <h1 class="text-2xl font-bold uppercase tracking-widest leading-tight text-var-main">
                ISP Config Generator
            </h1>
            <p class="text-var-secondary text-xs tracking-wide">
                SYSTEM INITIALIZED :: NOC OPERATIONS DASHBOARD (TCT)
            </p>
        </div>
        <div class="flex items-center gap-4">
            <button id="themeToggleBtn" onclick="toggleTheme()" class="text-xs noc-btn px-3 py-1 rounded transition-colors uppercase font-bold tracking-widest">
                🌙 Dark | ☀ Light
            </button>
            <div class="h-4 border-l border-var-color mx-1"></div>

            <a href="app-past/index.html" class="text-xs noc-btn px-3 py-1 rounded transition-colors uppercase font-bold">
                APP-MAIN
            </a>
            <a href="infra-tct.html" class="text-xs noc-btn filled px-3 py-1 rounded transition-colors uppercase font-bold">
                INFRA-TCT
            </a>
            <a href="app-past/glan.html" class="text-xs noc-btn px-3 py-1 rounded transition-colors uppercase font-bold">
                GLAN
            </a>
            
            <div class="text-xs animate-pulse flex items-center gap-2 border-var-color border px-3 py-1 rounded" style="color:var(--border-color); background:var(--copy-bg)">
                <div class="w-2 h-2 rounded-full bg-var-color"></div>
                ONLINE
            </div>
        </div>
    </header>

    <script src="app-past/phone-utils.js"></script>
    <script src="app-past/parser-utils.js"></script>
    <script src="app-past/speed-calculator.js"></script>

    <!-- Main 3-Column Grid -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">

        <!-- LEFT PANEL: CUSTOMER INFO -->
        <section class="noc-panel flex flex-col h-full">
            <h2 class="font-bold mb-4 flex items-center gap-2 border-b border-var-color pb-2 text-var-accent">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                >> CUSTOMER INFO
            </h2>
            
            <div class="mb-4 flex-grow flex flex-col">
                <label class="noc-label">Paste Ticket Data</label>
                <textarea id="customerTicket" class="noc-input w-full p-3 text-xs flex-grow resize-none min-h-[150px]"
                    placeholder="Paste TCT customer ticket here..."></textarea>
            </div>

            <div class="noc-inner-box p-3 rounded space-y-3">
                <h3 class="noc-label border-b border-var-color pb-1 mb-2 opacity-80">Parsed Data Extractor</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] uppercase block mb-1 text-var-muted">Customer ID</label>
                        <div id="disp_id" class="text-sm font-bold truncate h-5 text-var-main">--</div>
                    </div>
                    <div>
                        <label class="text-[10px] uppercase block mb-1 text-var-muted">Order ID</label>
                        <div id="disp_order" class="text-sm font-bold truncate h-5 text-var-main">--</div>
                    </div>
                    <div class="col-span-2 border-t border-var-color pt-2">
                        <label class="text-[10px] uppercase block mb-1 text-var-muted">Customer Name</label>
                        <div id="disp_name" class="text-sm font-bold truncate h-5 text-var-main">--</div>
                    </div>
                    <div class="col-span-2">
                        <label class="text-[10px] uppercase block mb-1 text-var-muted">Phone</label>
                        <div id="disp_phone" class="text-sm font-bold truncate h-5 text-var-main">--</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- CENTER PANEL: NETWORK CONFIG -->
        <section class="noc-panel flex flex-col h-full">
            <h2 class="font-bold mb-4 flex items-center gap-2 border-b border-var-color pb-2 text-var-accent">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                >> NETWORK CONFIGURATION
            </h2>

            <div class="space-y-4 flex-grow">
                <div>
                    <label class="noc-label">PROD ID</label>
                    <input type="text" id="prodInput" class="noc-input w-full p-2 text-sm uppercase" placeholder="2150085986AGQB019129">
                </div>
                <div>
                    <label class="noc-label">MAC Address</label>
                    <input type="text" id="macInput" class="noc-input w-full p-2 text-sm uppercase" placeholder="78DD335DB138">
                </div>
                <div>
                    <label class="noc-label">SN (Serial Number)</label>
                    <input type="text" id="snInput" class="noc-input w-full p-2 text-sm uppercase" placeholder="4857544327C2CFA4">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="noc-label">Connection Type</label>
                        <select id="connectionType" class="noc-input w-full p-2 text-sm">
                            <option value="2422">PPPoE</option>
                            <option value="2423">Static IP</option>
                        </select>
                    </div>
                    <div>
                        <label class="noc-label">Package Type</label>
                        <select id="packageType" class="noc-input w-full p-2 text-sm">
                            <option value="@fiberlink">@fiberlink</option>
                            <option value="@todayhome">@todayhome</option>
                            <option value="@todayfiber">@todayfiber</option>
                            <option value="@todayplus">@todayplus</option>
                            <option value="@sf">@sf</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="noc-label">ONU Interface</label>
                    <div class="flex gap-2 items-center">
                        <select id="interfacePrefix" class="noc-input p-2 text-sm shrink-0">
                            <option value="EPON0/1:" selected>EPON0/1:</option>
                            <option value="GPON0/1:">GPON0/1:</option>
                        </select>
                        <input type="text" id="onuId" class="noc-input w-full p-2 text-sm" value="" placeholder="ONU ID (e.g. 36)">
                        <button onclick="copyInterface()" class="copy-btn text-[10px] px-2 py-2 flex items-center gap-1 font-mono uppercase font-bold shrink-0">
                            COPY
                        </button>
                    </div>
                </div>

                <!-- Toggles Container -->
                <div class="pt-4 mt-2 border-t border-var-color space-y-3">
                    <!-- IPCAM -->
                    <div class="flex items-center justify-between opacity-50">
                        <label class="noc-label !mb-0 cursor-not-allowed">>> IPCAM_MODE</label>
                        <button type="button" class="relative w-10 h-5 rounded-full transition-colors duration-300 border border-var-color cursor-not-allowed" style="background-color: var(--input-border)">
                            <span class="absolute top-[1px] left-[2px] w-4 h-4 rounded-full transition-all duration-300" style="background-color: var(--text-muted)"></span>
                        </button>
                    </div>

                    <!-- DNS -->
                    <div class="flex items-center justify-between opacity-50">
                        <label class="noc-label !mb-0 cursor-not-allowed">>> DNS_MODE</label>
                        <button type="button" class="relative w-10 h-5 rounded-full transition-colors duration-300 border border-var-color cursor-not-allowed" style="background-color: var(--input-border)">
                            <span class="absolute top-[1px] left-[2px] w-4 h-4 rounded-full transition-all duration-300" style="background-color: var(--text-muted)"></span>
                        </button>
                    </div>

                    <!-- SPEED CALCULATOR -->
                    <div class="flex items-center justify-between">
                        <label class="noc-label !mb-0 cursor-pointer" onclick="toggleSpeed()">>> SPEED_CALCULATOR</label>
                        <button id="speedToggle" type="button" class="relative w-10 h-5 rounded-full transition-colors duration-300 border border-var-color" style="background-color: var(--input-border)" onclick="toggleSpeed()">
                            <span id="speedDot" class="absolute top-[1px] left-[2px] w-4 h-4 rounded-full transition-all duration-300" style="background-color: var(--toggle-off)"></span>
                        </button>
                    </div>
                    <div id="speedCalculatorFields" class="hidden noc-inner-box p-2 rounded">
                        <label class="noc-label">Speed (Mbps)</label>
                        <input type="number" id="speedInput" class="noc-input w-full p-1.5 text-xs mb-2" placeholder="e.g. 50" oninput="calculateSpeed()">
                        <input type="text" id="speedOutput" class="w-full text-[11px] font-mono bg-transparent border-0 focus:outline-none text-var-main" placeholder="Awaiting input...">
                    </div>
                </div>
            </div>
        </section>

        <!-- RIGHT PANEL: OUTPUT (STACKED) -->
        <section class="noc-panel flex flex-col h-full gap-4 overflow-y-auto">
            
            <div class="flex flex-col h-[200px] shrink-0">
                <div class="flex justify-between items-center mb-1">
                    <label class="noc-label !mb-0">>> USER_INFO_OUTPUT</label>
                    <button onclick="copyOutput('userInfoOutput', this)" class="copy-btn text-[10px] px-3 py-1 flex items-center gap-1 font-mono uppercase font-bold">
                        COPY
                    </button>
                </div>
                <textarea id="userInfoOutput" class="noc-output-area w-full flex-grow p-3 text-xs resize-none" placeholder="User Information will appear here..."></textarea>
            </div>

            <div class="flex flex-col h-[200px] shrink-0">
                <div class="flex justify-between items-center mb-1">
                    <label class="noc-label !mb-0">>> TO_TCT_GROUP</label>
                    <button onclick="copyOutput('tctGroupOutput', this)" class="copy-btn text-[10px] px-3 py-1 flex items-center gap-1 font-mono uppercase font-bold">
                        COPY
                    </button>
                </div>
                <textarea id="tctGroupOutput" class="noc-output-area w-full flex-grow p-3 text-xs resize-none" placeholder="TCT Group format will appear here..."></textarea>
            </div>

        </section>

    </main>

    <!-- Bottom Action Bar -->
    <div class="mt-6 flex justify-center items-center gap-6 mb-2">
        <button id="generateBtn" onclick="executeGeneration(event)" class="noc-btn filled border border-var-color font-bold py-3 px-8 rounded-lg shadow-[0_0_15px_rgba(0,0,0,0.1)] transition-all uppercase tracking-widest flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            GENERATE CONFIG
        </button>
        <button onclick="resetAll()" class="text-var-muted hover:text-var-main border border-var-color opacity-80 hover:opacity-100 font-bold py-3 px-6 rounded-lg transition-all uppercase tracking-widest text-sm">
            RESET
        </button>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 font-bold px-4 py-2 rounded shadow-lg flex items-center gap-2 z-50 text-xs tracking-widest uppercase border-var-color border" style="background-color: var(--copy-bg); color: var(--border-color)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        DATA COPIED TO CLIPBOARD
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.className;
            const newTheme = currentTheme === 'dark-theme' ? 'light-theme' : 'dark-theme';
            
            html.className = newTheme;
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('ispTheme', newTheme);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const customerInput = document.getElementById('customerTicket');
            
            customerInput.addEventListener('input', () => {
                autoResize(customerInput);
                const data = extractData(customerInput.value);
                document.getElementById('disp_id').innerText = data.id !== "UNKNOWN" ? data.id : '--';
                document.getElementById('disp_name').innerText = data.name !== "UNKNOWN" ? data.name : '--';
                document.getElementById('disp_phone').innerText = data.phone !== "UNKNOWN" ? data.phone : '--';
                document.getElementById('disp_order').innerText = data.orderNum !== "UNKNOWN" ? data.orderNum : '--';
            });
            
            customerInput.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') {
                    executeGeneration(e);
                }
            });

            const generateBtn = document.getElementById('generateBtn');
            if (generateBtn) {
                generateBtn.addEventListener('click', executeGeneration);
            }
        });

        function autoResize(textarea) {
            textarea.style.height = '150px';
            const scrollHeight = textarea.scrollHeight;
            if (scrollHeight > 150) {
                textarea.style.height = (scrollHeight + 2) + 'px';
            }
        }

        function copyOutput(elementId, btnElement) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            
            const toast = document.getElementById('toast');
            toast.classList.add('toast-show');
            setTimeout(() => { toast.classList.remove('toast-show'); }, 2000);
        }

        function copyInterface() {
            const prefix = document.getElementById('interfacePrefix').value;
            const onuIdElem = document.getElementById('onuId');
            if(onuIdElem && onuIdElem.value) {
                const combined = prefix + onuIdElem.value;
                navigator.clipboard.writeText(combined)
                    .then(() => {
                        const toast = document.getElementById('toast');
                        toast.classList.add('toast-show');
                        setTimeout(() => { toast.classList.remove('toast-show'); }, 2000);
                    })
                    .catch(err => {
                        console.error("Failed to copy text: ", err);
                    });
            }
        }

        function extractData(text) {
            // ID
            const idMatch = text.match(/^\s*(?:CID\s*\/|C)?ID\s*[:.]?\s*([^\n\r]+)/im);
            // Name
            let nameVal = "UNKNOWN";
            const nameMatch = text.match(/^\s*Name\b\s*[:.]?\s*([^\n\r]+)/im);
            if (nameMatch) {
                nameVal = nameMatch[1].trim();
            } else if (idMatch) {
                const lines = text.split(/\r?\n/);
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes(idMatch[0])) {
                        if (i + 1 < lines.length) {
                            const nextLine = lines[i + 1].trim();
                            if (nextLine && !/^(?:contact|address|note|order|phone|cid|id|password)\s*[:.]/i.test(nextLine)) {
                                nameVal = nextLine;
                                break;
                            }
                        }
                    }
                }
            }

            // Order
            const orderMatch = text.match(/(?:order|order\s*id)\s*[:.\uFF1A]?\s*([^\n\r]+)/i) || text.match(/(TD\d{4})/i);
            const fullOrderMatch = text.match(/(TD\d{4}-TCT)/i);

            return {
                id: idMatch ? idMatch[1].trim() : "UNKNOWN",
                name: nameVal,
                phone: normalizePhoneNumber(text),
                orderFull: fullOrderMatch ? fullOrderMatch[1].trim() : null,
                orderNum: orderMatch ? orderMatch[1].trim() : "UNKNOWN"
            };
        }

        function executeGeneration(event) {
            if (event) event.preventDefault();
            const ticketText = document.getElementById('customerTicket').value;
            const sn = document.getElementById('snInput').value.trim();
            const connectionType = document.getElementById('connectionType').value;
            const packageType = document.getElementById('packageType').value;

            if (!ticketText) {
                alert("Please paste the customer ticket info first.");
                return;
            }
            if (!sn) {
                alert("Please enter the SN.");
                return;
            }

            const data = extractData(ticketText);
            const last8 = sn.length >= 8 ? sn.slice(-8) : sn;
            const username = `${last8}${packageType}`;
            
            let password = data.phone;
            // password already normalized to 0... format in extractData -> normalizePhoneNumber

            const preConfigStatus = isPreConfig(ticketText);

            const heading = preConfigStatus ? "Done Pre-config Bong" : "Done active please help confirm service";
            const footerText = preConfigStatus ? "Thank you, Bong." : "Thank you.";

            const orderLine = data.orderNum !== "UNKNOWN" ? `Order : ${data.orderNum}\n` : (data.orderFull ? `${data.orderFull}\n` : "");

            const prod = document.getElementById('prodInput').value.trim();
            const mac = document.getElementById('macInput').value.trim();

            const output1 = `${heading}\n\nID: ${data.id}\nName: ${data.name}\nUsername: ${username}\nPassword: ${password}\n${orderLine}\n${footerText}`;
            const output2 = `Dear bong, please active this customer new install\n\nOrder : ${data.orderNum}\nVLAN : ${connectionType}\nMode : Bridge\n\nPROD ID:${prod}\nMAC:${mac}\nSN:${sn}\n\nThanks`;

            document.getElementById('userInfoOutput').value = output1;
            document.getElementById('tctGroupOutput').value = output2;
        }

        function resetAll() {
            document.getElementById('customerTicket').value = '';
            document.getElementById('prodInput').value = '';
            document.getElementById('macInput').value = '';
            document.getElementById('snInput').value = '';
            document.getElementById('onuId').value = '';
            document.getElementById('connectionType').selectedIndex = 0;
            document.getElementById('packageType').selectedIndex = 0;
            
            document.getElementById('disp_id').innerText = '--';
            document.getElementById('disp_name').innerText = '--';
            document.getElementById('disp_phone').innerText = '--';
            document.getElementById('disp_order').innerText = '--';

            document.getElementById('userInfoOutput').value = '';
            document.getElementById('tctGroupOutput').value = '';
            
            if (typeof toggleSpeed === 'function' && speedEnabled) toggleSpeed();
        }
    </script>
</body>

</html>
