<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP Config Generator</title>
    <link rel="icon" href="app-past/favicon.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Dark Mode: Hacker Font */
        .dark body {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Light Mode: Inter Font */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Scrollbar for Hacker Mode */
        .dark ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .dark ::-webkit-scrollbar-track {
            background: #000;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #15803d;
            border-radius: 2px;
        }

        .dark ::-webkit-scrollbar-thumb:hover {
            background: #22c55e;
        }
        
        .glitch-text {
            text-shadow: 0 0 5px #22c55e;
        }
        
        /* Needed for the specific toast animation to match our functionality while keeping standard classes */
        .toast-show {
            transform: translateY(0);
            opacity: 1;
        }

        textarea {
            min-height: 120px;
            resize: none;
            overflow: hidden;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-black dark:text-green-500 transition-colors duration-300 min-h-screen p-2 md:p-4 dark:selection:bg-green-900 dark:selection:text-white">

    <!-- Wrapper: Light(Rounded/White/Shadow) vs Dark(Square/Black/GreenBorder/Glow) -->
    <div class="max-w-4xl mx-auto 
        bg-white rounded-xl shadow-lg border border-slate-200
        dark:bg-slate-950 dark:rounded-none dark:shadow-[0_0_20px_rgba(34,197,94,0.2)] dark:border-green-800
        overflow-hidden transition-all duration-300">

        <!-- Header -->
        <div class="px-4 py-2 flex justify-between items-center
            bg-slate-900 border-b border-slate-200
            dark:bg-black dark:border-green-800">
            
            <!-- Link Back to Main App -->
            <a href="app-past/index.html"
                class="mr-4 px-3 py-1 text-xs font-bold uppercase tracking-wider border transition-all text-slate-400 border-slate-600 hover:text-white hover:border-white dark:text-green-800 dark:border-green-900 dark:hover:text-green-400 dark:hover:border-green-500">
                APP-MAIN
            </a>
            
            <div>
                <!-- Title: White in Light Mode header (since header is dark slate), Green in Dark Mode -->
                <h1 class="text-xl font-bold text-white dark:text-green-400 uppercase tracking-widest dark:glitch-text">
                    ISP Config Generator</h1>
                <p class="text-slate-400 dark:text-green-800 text-xs">
                    <span class="hidden dark:inline">Initializing system... Ready.</span>
                    <span class="dark:hidden">Generate customer configuration instantly</span>
                </p>
            </div>

            <div class="flex items-center gap-2">
                <!-- Status Indicator -->
                <div class="text-xs text-green-400 dark:text-green-900 animate-pulse font-mono">● ONLINE</div>
            </div>
        </div>

        <div class="p-4 grid grid-cols-1 lg:grid-cols-2 gap-4">

            <!-- Left Column: Inputs -->
            <div class="space-y-2">
                <div>
                    <label class="block text-xs font-bold mb-1 uppercase tracking-wider text-slate-700 dark:text-green-700">
                        <span class="dark:hidden">Customer Info Block</span>
                        <span class="hidden dark:inline">>> Customer Info Block</span>
                    </label>
                    <textarea id="customerTicket" rows="8"
                        class="w-full px-3 py-2 text-sm transition-all
                        bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:ring-blue-500 focus:border-blue-500
                        dark:bg-black dark:border-green-800 dark:rounded-none dark:font-mono dark:text-green-400 dark:placeholder-green-900 dark:focus:border-green-500 dark:focus:ring-green-500"
                        placeholder="Paste text here like:&#10;ID: 114216&#10;Name: Nev Sophanny&#10;Address: Borey Chip Mong 50M #03 St.P08&#10;Phone: 85599999343&#10;Type: PPPoE&#10;Package: TODAY Fiber Link-Light 70Mbps&#10;TD0350-TCT"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1 uppercase tracking-wider text-slate-700 dark:text-green-700">
                        <span class="dark:hidden">SN</span>
                        <span class="hidden dark:inline">>> SN</span>
                    </label>
                    <input type="text" id="snInput"
                        class="w-full px-3 py-2 text-sm transition-all
                        bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:ring-blue-500 focus:border-blue-500
                        dark:bg-black dark:border-green-800 dark:rounded-none dark:font-mono dark:text-green-400 dark:placeholder-green-900 dark:focus:border-green-500 dark:focus:ring-green-500"
                        placeholder="4857544327C2CFA4">
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1 uppercase tracking-wider text-slate-700 dark:text-green-700">
                        <span class="dark:hidden">Connection Type</span>
                        <span class="hidden dark:inline">>> Connection Type</span>
                    </label>
                    <select id="connectionType"
                        class="w-full px-3 py-2 text-sm transition-all
                        bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:ring-blue-500 focus:border-blue-500
                        dark:bg-black dark:border-green-800 dark:rounded-none dark:font-mono dark:text-green-400 dark:focus:border-green-500">
                        <option value="2422">PPPoE</option>
                        <option value="2423">Static IP</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1 uppercase tracking-wider text-slate-700 dark:text-green-700">
                        <span class="dark:hidden">Package Type</span>
                        <span class="hidden dark:inline">>> Package Type</span>
                    </label>
                    <select id="packageType"
                        class="w-full px-3 py-2 text-sm transition-all
                        bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:ring-blue-500 focus:border-blue-500
                        dark:bg-black dark:border-green-800 dark:rounded-none dark:font-mono dark:text-green-400 dark:focus:border-green-500">
                        <option value="@fiberlink">@fiberlink</option>
                        <option value="@todayhome">@todayhome</option>
                        <option value="@todayfiber">@todayfiber</option>
                        <option value="@todayplus">@todayplus</option>
                        <option value="@sf">@sf</option>
                    </select>
                </div>

                <!-- SPEED CALCULATOR TOGGLE -->
                <div class="flex items-center justify-between py-1 border-t border-slate-200 dark:border-green-900 mt-2 pt-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-green-700 cursor-pointer">
                        <span class="dark:hidden">Speed Calculator</span>
                        <span class="hidden dark:inline">>> SPEED_CALCULATOR</span>
                    </label>
                    <button id="speedToggle" type="button" class="relative w-12 h-6 rounded-full transition-colors duration-300 bg-slate-300 dark:bg-slate-800 dark:border dark:border-green-900 dark:rounded-none" onclick="toggleSpeed()">
                        <span id="speedDot" class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full transition-all duration-300 bg-white shadow dark:bg-green-900 dark:rounded-none"></span>
                    </button>
                </div>

                <!-- SPEED CALCULATOR FIELDS (HIDDEN BY DEFAULT) -->
                <div id="speedCalculatorFields" class="hidden">
                    <input type="number" id="speedInput"
                        class="w-full px-3 py-2 text-sm transition-all mb-2
                        bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:ring-blue-500 focus:border-blue-500
                        dark:bg-black dark:border-green-800 dark:rounded-none dark:font-mono dark:text-green-400 dark:placeholder-green-900 dark:focus:border-green-500 dark:focus:ring-green-500"
                        placeholder="Speed (Mbps) e.g. 50"
                        oninput="calculateSpeed()">
                    
                    <div class="p-2 relative group transition-all
                        bg-slate-50 rounded-lg border border-slate-200
                        dark:bg-black dark:rounded-none dark:border-green-800 dark:shadow-inner dark:shadow-green-900/20 mt-2">
                        <div class="flex justify-between items-center mb-1 pb-1
                            border-b border-transparent dark:border-green-900">
                            <label class="text-[10px] font-bold uppercase tracking-widest text-slate-400 dark:text-green-700">
                                <span class="dark:hidden">Speed Output</span>
                                <span class="hidden dark:inline">>> SPEED_OUTPUT</span>
                            </label>
                            <button onclick="copySpeedOutput(this)"
                                class="text-[10px] px-2 py-0.5 transition-colors flex items-center gap-1 font-mono uppercase
                                bg-white hover:bg-slate-100 text-slate-600 border border-slate-300 rounded
                                dark:bg-slate-900 dark:hover:bg-green-900 dark:text-green-500 dark:border-green-700 dark:rounded-none">
                                <span class="dark:hidden">Copy</span>
                                <span class="hidden dark:inline">CPY</span>
                            </button>
                        </div>
                        <input type="text" id="speedOutput" readonly onclick="this.select();" 
                            class="w-full text-xs font-mono bg-transparent border-0 focus:ring-0 p-0 text-slate-800 dark:text-green-300"
                            placeholder="Awaiting input...">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1 uppercase tracking-wider text-slate-700 dark:text-green-700">
                        <span class="dark:hidden">GPON/EPON:ONU</span>
                        <span class="hidden dark:inline">>> GPON/EPON:ONU</span>
                    </label>
                    <div class="flex gap-1">
                        <select id="interfacePrefix"
                            class="px-2 py-2 text-sm transition-all shrink-0
                            bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:ring-blue-500 focus:border-blue-500
                            dark:bg-black dark:border-green-800 dark:rounded-none dark:font-mono dark:text-green-400 dark:focus:border-green-500">
                            <option value="EPON0/1:" selected>EPON0/1:</option>
                            <option value="GPON0/1:">GPON0/1:</option>
                        </select>
                        <input type="text" id="onuId"
                            class="w-full min-w-0 px-3 py-2 text-sm transition-all
                            bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:ring-blue-500 focus:border-blue-500
                            dark:bg-black dark:border-green-800 dark:rounded-none dark:font-mono dark:text-green-400 dark:placeholder-green-900 dark:focus:border-green-500"
                            placeholder="ONU ID (e.g. 36)">
                    </div>
                </div>

                <!-- IPCAM Toggle (Visual match only to structure for consistency, JS toggle classes omitted for briefity if unused in script, but matches DOM logic) -->
                <div class="flex items-center justify-between py-1">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-green-700 cursor-pointer">
                        <span class="dark:hidden">IPCAM Mode</span>
                        <span class="hidden dark:inline">>> IPCAM_MODE</span>
                    </label>
                    <button id="ipcamToggle" type="button" class="relative w-12 h-6 rounded-full transition-colors duration-300 bg-slate-300 dark:bg-slate-800 dark:border dark:border-green-900 dark:rounded-none" onclick="toggleBtnVisual(this)">
                        <span class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full transition-all duration-300 bg-white shadow dark:bg-green-900 dark:rounded-none"></span>
                    </button>
                </div>

                <!-- DNS Toggle -->
                <div class="flex items-center justify-between py-1">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-green-700 cursor-pointer">
                        <span class="dark:hidden">DNS Mode</span>
                        <span class="hidden dark:inline">>> DNS_MODE</span>
                    </label>
                    <button id="dnsToggle" type="button" class="relative w-12 h-6 rounded-full transition-colors duration-300 bg-slate-300 dark:bg-slate-800 dark:border dark:border-green-900 dark:rounded-none" onclick="toggleBtnVisual(this)">
                        <span class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full transition-all duration-300 bg-white shadow dark:bg-green-900 dark:rounded-none"></span>
                    </button>
                </div>
                
                <button id="generateBtn" onclick="executeGeneration()"
                    class="w-full font-bold py-2 transition-all shadow-sm uppercase tracking-wider text-sm
                    bg-blue-600 hover:bg-blue-700 text-white rounded-lg
                    dark:bg-green-700 dark:hover:bg-green-600 dark:text-black dark:rounded-none dark:shadow-[0_0_10px_rgba(21,128,61,0.5)] dark:hover:shadow-[0_0_15px_rgba(34,197,94,0.7)] dark:border dark:border-green-500">
                    <span class="dark:hidden">Generate Configuration</span>
                    <span class="hidden dark:inline">[ EXECUTE_GENERATION ]</span>
                </button>
            </div>

            <!-- Right Column: Outputs -->
            <div class="space-y-3">

                <!-- Output 1 -->
                <div class="p-3 relative group transition-all
                    bg-slate-50 rounded-lg border border-slate-200
                    dark:bg-black dark:rounded-none dark:border-green-800 dark:shadow-inner dark:shadow-green-900/20">

                    <div class="flex justify-between items-center mb-2 pb-2
                        border-b border-transparent dark:border-green-900">
                        <label class="text-xs font-bold uppercase tracking-widest text-slate-500 dark:text-green-600">
                            <span class="dark:hidden">Output Our Team</span>
                            <span class="hidden dark:inline">>> OUTPUT_OUR_TEAM</span>
                        </label>
                        <button onclick="copyOutput('output1', this)"
                            class="text-xs px-3 py-1 transition-colors flex items-center gap-1 font-mono uppercase
                            bg-white hover:bg-slate-100 text-slate-600 border border-slate-300 rounded
                            dark:bg-slate-900 dark:hover:bg-green-900 dark:text-green-500 dark:border-green-700 dark:rounded-none">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                                </path>
                            </svg>
                            <span class="dark:hidden">Copy</span>
                            <span class="hidden dark:inline">CPY</span>
                        </button>
                    </div>
                    <textarea id="output1" rows="8" readonly onclick="this.removeAttribute('readonly');" 
                        class="w-full text-xs font-mono whitespace-pre overflow-x-auto min-h-[60px] bg-transparent border-0 focus:ring-0 p-0 resize-y text-slate-800 dark:text-green-300"></textarea>
                </div>

                <!-- Output 2 -->
                <div class="p-3 relative group transition-all
                    bg-slate-50 rounded-lg border border-slate-200
                    dark:bg-black dark:rounded-none dark:border-green-800 dark:shadow-inner dark:shadow-green-900/20">

                    <div class="flex justify-between items-center mb-2 pb-2
                        border-b border-transparent dark:border-green-900">
                        <label class="text-xs font-bold uppercase tracking-widest text-slate-500 dark:text-green-600">
                            <span class="dark:hidden">To TCT Group</span>
                            <span class="hidden dark:inline">>> TO_TCT_GROUP</span>
                        </label>
                        <button onclick="copyOutput('output2', this)"
                            class="text-xs px-3 py-1 transition-colors flex items-center gap-1 font-mono uppercase
                            bg-white hover:bg-slate-100 text-slate-600 border border-slate-300 rounded
                            dark:bg-slate-900 dark:hover:bg-green-900 dark:text-green-500 dark:border-green-700 dark:rounded-none">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                                </path>
                            </svg>
                            <span class="dark:hidden">Copy</span>
                            <span class="hidden dark:inline">CPY</span>
                        </button>
                    </div>
                    <textarea id="output2" rows="8" readonly onclick="this.removeAttribute('readonly');" 
                        class="w-full text-xs font-mono whitespace-pre overflow-x-auto min-h-[60px] bg-transparent border-0 focus:ring-0 p-0 resize-y text-slate-800 dark:text-green-300"></textarea>
                </div>

            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 text-xs bg-slate-800 text-white dark:bg-green-500 dark:text-black dark:border-2 dark:border-black px-4 py-2 font-bold uppercase tracking-widest transform translate-y-20 opacity-0 transition-all duration-300 shadow-lg dark:shadow-[0_0_10px_rgba(34,197,94,0.6)] z-50">
        DATA COPIED TO CLIPBOARD
    </div>

    <script>
        // Auto resize function
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const textareas = document.querySelectorAll('textarea');
            textareas.forEach(ta => {
                ta.addEventListener('input', () => autoResize(ta));
            });
        });

        // Copy function using new visual feedback pattern
        function copyOutput(elementId, btnElement) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            
            // Show toast
            const toast = document.getElementById('toast');
            toast.classList.add('toast-show');
            
            setTimeout(() => {
                toast.classList.remove('toast-show');
            }, 2000);
        }

        // Dedicated copy function for the inline text input of the speed calculator
        function copySpeedOutput(btnElement) {
            const inputField = document.getElementById('speedOutput');
            inputField.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            
            // Show toast
            const toast = document.getElementById('toast');
            toast.classList.add('toast-show');
            
            setTimeout(() => {
                toast.classList.remove('toast-show');
            }, 2000);
        }

        // Speed Toggle Logic
        let speedEnabled = false;

        function toggleSpeed() {
            speedEnabled = !speedEnabled;
            const fields = document.getElementById('speedCalculatorFields');
            const toggleBtn = document.getElementById('speedToggle');
            const dot = document.getElementById('speedDot');

            if (speedEnabled) {
                // Show fields
                fields.classList.remove('hidden');
                // Toggle ON style (matches blue-500/green-700 visually)
                toggleBtn.classList.replace('dark:bg-slate-800', 'dark:bg-green-700');
                toggleBtn.classList.replace('bg-slate-300', 'bg-blue-600');
                dot.style.transform = 'translateX(24px)';
                dot.classList.replace('dark:bg-green-900', 'dark:bg-green-400');
            } else {
                // Hide fields
                fields.classList.add('hidden');
                // Toggle OFF style
                toggleBtn.classList.replace('dark:bg-green-700', 'dark:bg-slate-800');
                toggleBtn.classList.replace('bg-blue-600', 'bg-slate-300');
                dot.style.transform = 'translateX(0)';
                dot.classList.replace('dark:bg-green-400', 'dark:bg-green-900');
                
                // Clear state to prevent ghost data
                document.getElementById('speedInput').value = '';
                document.getElementById('speedOutput').value = '';
            }
        }

        // Speed calculation logic
        function calculateSpeed() {
            const speedInput = document.getElementById('speedInput').value;
            const outputField = document.getElementById('speedOutput');
            
            if (!speedInput || speedInput <= 0) {
                outputField.value = '';
                return;
            }

            const speed = parseFloat(speedInput);
            const policeRate = speed * 1048576;
            const burst = Math.round(policeRate * 0.10625);
            const peakBurst = burst;

            // Strict single line formatting requirement
            outputField.value = `${speed} police rate ${policeRate} burst ${burst} peak-burst ${peakBurst}`;
        }

        // We only use actual toggle logic for Speed here, so removing toggleBtnVisual which was a dummy
        function extractData(text) {
            const idMatch = text.match(/ID:\s*(\w+)/i);
            const nameMatch = text.match(/Name:\s*([^\n]+)/i);
            const phoneMatch = text.match(/Phone:\s*(\d+)/i);
            const packageMatch = text.match(/Package:\s*([^\n]+)/i);
            const orderMatch = text.match(/(TD\d{4})/i);
            const fullOrderMatch = text.match(/(TD\d{4}-TCT)/i);

            return {
                id: idMatch ? idMatch[1].trim() : "UNKNOWN",
                name: nameMatch ? nameMatch[1].trim() : "UNKNOWN",
                phone: phoneMatch ? phoneMatch[1].trim() : "UNKNOWN",
                pkg: packageMatch ? packageMatch[1].trim() : "UNKNOWN",
                orderFull: fullOrderMatch ? fullOrderMatch[1].trim() : null,
                orderNum: orderMatch ? orderMatch[1].trim() : "UNKNOWN"
            };
        }

        function executeGeneration() {
            const ticketText = document.getElementById('customerTicket').value;
            const sn = document.getElementById('snInput').value.trim();
            const connectionType = document.getElementById('connectionType').value;
            const packageType = document.getElementById('packageType').value;

            if (!ticketText) {
                alert("Please paste the customer ticket info first.");
                return;
            }
            if (!sn) {
                alert("Please enter the SN.");
                return;
            }

            const data = extractData(ticketText);
            
            // Process Username: last 8 chars of SN + packageType
            const last8 = sn.length >= 8 ? sn.slice(-8) : sn;
            const username = `${last8}${packageType}`;
            
            // Process Password: Phone number, replacing 855 with 0 if it exists
            let password = data.phone;
            if (password.startsWith('855')) {
                password = '0' + password.slice(3);
            }

            // Fallback for orderFull if not found in text but orderNum is found
            const bottomTag = data.orderFull ? data.orderFull : (data.orderNum !== "UNKNOWN" ? `${data.orderNum}-TCT` : "");

            // OUTPUT 1 FORMAT
            const output1 = `Done Bong. Please help test!\n\nID: ${data.id}\nName: ${data.name}\nUsername: ${username}\nPassword: ${password}\n\n${bottomTag}`;

            // OUTPUT 2 FORMAT
            const output2 = `Dear bong, please active this customer new install\n\nOrder : ${data.orderNum}\nVLAN : ${connectionType}\nMode : Bridge\n\nSN : ${sn}`;

            document.getElementById('output1').value = output1;
            document.getElementById('output2').value = output2;
            
            autoResize(document.getElementById('output1'));
            autoResize(document.getElementById('output2'));
        }
    </script>
</body>

</html>
