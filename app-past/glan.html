<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLAN Config | ISP Config Generator</title>
    <link rel="icon" href="favicon.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- THEME INITIALIZATION SCRIPT -->
    <script>
        const savedTheme = localStorage.getItem('ispTheme') || 'dark-theme';
        document.documentElement.className = savedTheme;
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    
    <style>
        /* Theme Variables */
        :root.dark-theme {
            --bg-color: #050505;
            --panel-bg: #0b0b0b;
            --border-color: #00ff9c;
            --text-color: #00ff9c;
            --text-muted: #888888;
            --text-secondary: #888888;
            --label-color: #00ff9c;
            --input-bg: #000000;
            --input-border: #333333;
            --output-bg: #000000;
            --copy-bg: rgba(0, 255, 156, 0.1);
            --copy-text: #00ff9c;
            --copy-border: #00ff9c;
            --copy-radius: 4px;
            --copy-hover-bg: rgba(0, 255, 156, 0.2);
            --copy-hover-text: #00ff9c;
            --copy-hover-border: #00ff9c;
            --panel-shadow: 0 4px 6px rgba(0,0,0,0.5);
            --btn-hover-bg: #00ff9c;
            --btn-hover-text: #000000;
            --accent-color: #00ff9c;
            --focus-ring: rgba(0,255,156,0.15);
            --focus-border: #00ff9c;
            --panel-radius: 8px;
            --toggle-off: #888888;
            --toggle-on: #00ff9c;
        }

        :root.light-theme {
            --bg-color: #eef2f6;
            --panel-bg: #ffffff;
            --border-color: #c6ccd2;
            --text-color: #111827;
            --text-muted: #6b7280;
            --text-secondary: #374151;
            --label-color: #6b7280;
            --input-bg: #ffffff;
            --input-border: #c6ccd2;
            --output-bg: #f8fafc;
            --copy-bg: #059669;
            --copy-text: #ffffff;
            --copy-border: #059669;
            --copy-radius: 6px;
            --copy-hover-bg: #047857;
            --copy-hover-text: #ffffff;
            --copy-hover-border: #047857;
            --panel-shadow: 0 2px 8px rgba(0,0,0,0.06);
            --btn-hover-bg: #ffffff;
            --btn-hover-text: #059669;
            --accent-color: #059669;
            --focus-ring: rgba(5,150,105,0.15);
            --focus-border: #059669;
            --panel-radius: 10px;
            --toggle-off: #cbd5e1;
            --toggle-on: #059669;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--panel-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            opacity: 0.8;
        }
        
        .noc-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--panel-radius);
            padding: 16px;
            box-shadow: var(--panel-shadow);
            transition: background-color 0.3s, border-color 0.3s, border-radius 0.3s;
        }
        
        .noc-input {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            border-radius: 4px;
            transition: all 0.2s ease;
            resize: none;
            overflow-y: hidden;
            min-height: 38px;
        }
        
        .noc-input:focus {
            border-color: var(--focus-border);
            outline: none;
            box-shadow: 0 0 0 2px var(--focus-ring);
        }

        .noc-output-area {
            background-color: var(--output-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        
        .noc-output-area:focus {
            border-color: var(--focus-border);
            outline: none;
            box-shadow: 0 0 0 2px var(--focus-ring);
        }
        
        .noc-label {
            color: var(--label-color);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            margin-bottom: 4px;
            display: block;
        }

        .noc-btn {
            border: 1px solid var(--border-color);
            color: var(--border-color);
            background: transparent;
        }

        .noc-btn.filled {
            background: var(--border-color);
            color: var(--bg-color);
        }

        .noc-btn:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }
        
        .copy-btn {
            background-color: var(--copy-bg);
            color: var(--copy-text);
            border: 1px solid var(--copy-border);
            border-radius: var(--copy-radius);
            font-weight: 600;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background-color: var(--copy-hover-bg);
            color: var(--copy-hover-text);
            border-color: var(--copy-hover-border);
        }


        /* Make output areas flex properly inside their parents */
        textarea.noc-output-area, textarea.noc-input {
            min-height: 38px;
            max-height: 600px;
            overflow-y: hidden;
            resize: none;
        }

        textarea.noc-output-area {
            min-height: 150px;
        }

        .text-var-muted { color: var(--text-muted); }
        .text-var-secondary { color: var(--text-secondary); }
        .border-var-color { border-color: var(--border-color); }
        .bg-var-color { background-color: var(--border-color); }

        .noc-inner-box {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
        }

        .text-var-main { color: var(--text-color); }
        .text-var-accent { color: var(--accent-color); fill: var(--accent-color); }

        #toast {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.toast-show {
            opacity: 1;
            visibility: visible;
        }
        
        ::selection {
            background-color: var(--border-color);
            color: var(--bg-color);
        }
    </style>
</head>

<body class="min-h-screen p-4 flex flex-col">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6 px-2">
        <div>
            <h1 class="text-2xl font-bold uppercase tracking-widest leading-tight text-var-main">
                ISP Config Generator
            </h1>
            <p class="text-var-secondary text-xs tracking-wide">
                SYSTEM INITIALIZED :: NOC OPERATIONS DASHBOARD (GLAN)
            </p>
        </div>
        <div class="flex items-center gap-4">
            <!-- Theme Toggle -->
            <button id="themeToggleBtn" onclick="toggleTheme()" class="text-xs noc-btn px-3 py-1 rounded transition-colors uppercase font-bold tracking-widest">
                🌙 Dark | ☀ Light
            </button>
            <div class="h-4 border-l border-var-color mx-1"></div>

            <a href="index.html" class="text-xs noc-btn px-3 py-1 rounded transition-colors uppercase font-bold">
                APP-MAIN
            </a>
            <a href="../infra-tct.html" class="text-xs noc-btn px-3 py-1 rounded transition-colors uppercase font-bold">
                INFRA-TCT
            </a>
            <a href="glan.html" class="text-xs noc-btn filled px-3 py-1 rounded transition-colors uppercase font-bold">
                GLAN
            </a>
            <button onclick="openTopologyModal()" class="text-xs noc-btn px-3 py-1 rounded transition-colors uppercase font-bold flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                TOPOLOGY
            </button>
            <button onclick="openHistoryModal()" class="text-xs noc-btn px-3 py-1 rounded transition-colors uppercase font-bold flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                HISTORY (<span class="history-count-badge">0</span>)
            </button>
            
            <a id="adminLink" href="admin.html" class="hidden text-xs noc-btn px-3 py-1 rounded transition-colors uppercase font-bold">
                ADMIN
            </a>
            <button onclick="logout()" class="text-xs text-red-500 border border-red-500 px-3 py-1 rounded hover:bg-red-500 hover:text-white transition-colors font-bold uppercase">
                LOGOUT
            </button>
            <div class="text-xs animate-pulse flex items-center gap-2 border-var-color border px-3 py-1 rounded" style="color:var(--border-color); background:var(--copy-bg)">
                <div class="w-2 h-2 rounded-full bg-var-color"></div>
                ONLINE
            </div>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-grow">

        <!-- LEFT PANEL: INPUT -->
        <section class="noc-panel flex flex-col h-full">
            <h2 class="font-bold mb-4 flex items-center gap-2 border-b border-var-color pb-2 text-var-accent">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                >> GLAN INPUTS
            </h2>
            
            <div class="space-y-4 flex-grow">
                <div>
                    <label class="noc-label">Paste Ticket Data</label>
                    <textarea id="glanInfo" class="noc-input w-full p-2 text-sm" placeholder="Paste full ticket or enter 'ID Name' here..." rows="1"></textarea>
                </div>
                <div>
                    <label class="noc-label">Public IP Address</label>
                    <textarea id="glanIp" class="noc-input w-full p-2 text-sm" placeholder="e.g. 103.118.45.39" rows="1"></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="noc-label">Subnet</label>
                        <textarea id="glanSubnet" class="noc-input w-full p-2 text-sm" placeholder="e.g. 255.255.255.128" rows="1"></textarea>
                    </div>
                    <div>
                        <label class="noc-label">GW (Gateway)</label>
                        <textarea id="glanGw" class="noc-input w-full p-2 text-sm" placeholder="e.g. 103.118.45.1" rows="1"></textarea>
                    </div>
                </div>

                <div>
                    <label class="noc-label">GLAN ID</label>
                    <textarea id="glanValue" class="noc-input w-full p-2 text-sm" placeholder="e.g. 306" rows="1"></textarea>
                </div>
            </div>
            
            <!-- Generate Action -->
            <div class="mt-6">
                <button id="generateGlanBtn" onclick="generateGlanConfig(event)" class="noc-btn filled border border-var-color font-bold py-3 w-full rounded-lg shadow-[0_0_15px_rgba(0,0,0,0.1)] transition-all uppercase tracking-widest flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    GENERATE CONFIG
                </button>
            </div>

            <!-- SPEED CALCULATOR -->
            <div class="pt-4 mt-4 border-t border-var-color space-y-3">
                <div class="flex items-center justify-between">
                    <label class="noc-label !mb-0 cursor-pointer" onclick="toggleSpeed()">>> SPEED_CALCULATOR</label>
                    <button id="speedToggle" type="button" class="relative w-10 h-5 rounded-full transition-colors duration-300 border border-var-color" style="background-color: var(--input-border)" onclick="toggleSpeed()">
                        <span id="speedDot" class="absolute top-[1px] left-[2px] w-4 h-4 rounded-full transition-all duration-300" style="background-color: var(--toggle-off)"></span>
                    </button>
                </div>
                <div id="speedCalculatorFields" class="hidden noc-inner-box p-2 rounded">
                    <label class="noc-label">Speed (Mbps)</label>
                    <input type="number" id="speedInput" class="noc-input w-full p-1.5 text-xs mb-2" placeholder="e.g. 50" oninput="calculateSpeed()">
                    <input type="text" id="speedOutput" class="w-full text-[11px] font-mono bg-transparent border-0 focus:outline-none text-var-main" placeholder="Awaiting input...">
                </div>
            </div>
        </section>

        <!-- RIGHT PANEL: OUTPUT -->
        <section class="noc-panel flex flex-col h-full gap-4">
            
            <!-- Output 1: SHOW AND CONFIG -->
            <div class="flex flex-col flex-1 shrink-0">
                <div class="flex justify-between items-center mb-1">
                    <label class="noc-label !mb-0">>> SHOW_AND_CONFIG_OUTPUT</label>
                    <button onclick="copyOutput('glanConfigOutput', this)" class="copy-btn text-[10px] px-3 py-1 flex items-center gap-1 font-mono uppercase font-bold">
                        COPY
                    </button>
                </div>
                <textarea id="glanConfigOutput" class="noc-output-area w-full flex-grow p-3 text-xs" placeholder="Show and Config lines will appear here..."></textarea>
            </div>

            <!-- Output 2: GROUP MESSAGE -->
            <div class="flex flex-col flex-1 shrink-0">
                <div class="flex justify-between items-center mb-1">
                    <label class="noc-label !mb-0">>> GROUP_MESSAGE_OUTPUT</label>
                    <button onclick="copyOutput('glanGroupOutput', this)" class="copy-btn text-[10px] px-3 py-1 flex items-center gap-1 font-mono uppercase font-bold">
                        COPY
                    </button>
                </div>
                <textarea id="glanGroupOutput" class="noc-output-area w-full flex-grow p-3 text-xs" placeholder="Group Message text will appear here..."></textarea>
            </div>
            
        </section>

    </main>

    <!-- Credit Footer -->
    <footer class="mt-4 mb-2 text-center">
        <span class="text-[10px] tracking-[0.3em] uppercase" style="color: var(--text-muted); opacity: 0.6; transition: opacity 0.3s;" onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0.6'">
            ⚡ Crafted by <span style="color: var(--accent-color); text-shadow: 0 0 8px var(--accent-color);">Beebath</span>
        </span>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 font-bold px-4 py-2 rounded shadow-lg flex items-center gap-2 z-50 text-xs tracking-widest uppercase border-var-color border" style="background-color: var(--copy-bg); color: var(--border-color)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        DATA COPIED TO CLIPBOARD
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        checkAuth(async (user) => {
            const isAdmin = await checkAdmin(user);
            if (isAdmin) {
                document.getElementById('adminLink').classList.remove('hidden');
            }
        });
        
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.className;
            const newTheme = currentTheme === 'dark-theme' ? 'light-theme' : 'dark-theme';
            html.className = newTheme;
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('ispTheme', newTheme);
        }

        // Auto-expand textarea logic
        function autoExpand(field) {
            if (!field) return;
            field.style.height = 'inherit';
            const computed = window.getComputedStyle(field);
            const height = parseInt(computed.getPropertyValue('border-top-width'), 10)
                         + field.scrollHeight
                         + parseInt(computed.getPropertyValue('border-bottom-width'), 10);
            field.style.height = height + 'px';
            
            // Toggle overflow if it hits max height
            if (height >= 600) {
                field.style.overflowY = 'auto';
            } else {
                field.style.overflowY = 'hidden';
            }
        }

        document.addEventListener('input', function (event) {
            if (event.target.tagName.toLowerCase() !== 'textarea') return;
            autoExpand(event.target);
        });

        // Initial expand for all textareas
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.querySelectorAll('textarea').forEach(el => autoExpand(el));
            }, 100);
        });
    </script>
    <!-- Topology Modal -->
    <div id="topologyModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex-col p-4 md:p-6 transition-all duration-300">
        <div class="noc-panel flex flex-col w-full h-full max-w-7xl mx-auto rounded-lg shadow-2xl overflow-hidden border border-var-color" style="background-color: var(--panel-bg)">
            <!-- Modal Header -->
            <div class="flex items-center justify-between p-4 border-b border-var-color shrink-0">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5 text-var-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <h2 class="text-sm font-bold uppercase tracking-wider text-var-main !mb-0">>> NETWORK TOPOLOGY VIEWER</h2>
                </div>
                <div class="flex items-center gap-3">
                    <label class="text-[11px] noc-btn px-2.5 py-1 rounded cursor-pointer uppercase font-bold flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <span>Load Local PDF</span>
                        <input type="file" accept="application/pdf" class="hidden" onchange="loadCustomPdf(event)">
                    </label>
                    <a id="openPdfNewTab" href="../topology.pdf" target="_blank" class="text-[11px] noc-btn px-2.5 py-1 rounded uppercase font-bold flex items-center gap-1">
                        ↗ Open Tab
                    </a>
                    <button onclick="closeTopologyModal()" class="text-xs font-bold px-3 py-1 rounded border border-red-500/40 text-red-400 hover:bg-red-500/20 transition-all uppercase">
                        ✕ Close
                    </button>
                </div>
            </div>
            <!-- Modal Body (PDF Viewer) -->
            <div class="flex-grow w-full h-full relative" style="background-color: var(--input-bg)">
                <iframe id="topologyIframe" src="../topology.pdf" class="w-full h-full border-0"></iframe>
            </div>
        </div>
    </div>

    <script>
        function openTopologyModal() {
            const modal = document.getElementById('topologyModal');
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function closeTopologyModal() {
            const modal = document.getElementById('topologyModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function loadCustomPdf(event) {
            const file = event.target.files[0];
            if (file) {
                const fileUrl = URL.createObjectURL(file);
                const iframe = document.getElementById('topologyIframe');
                const openBtn = document.getElementById('openPdfNewTab');
                if (iframe) iframe.src = fileUrl;
                if (openBtn) openBtn.href = fileUrl;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeTopologyModal();
        });
    </script>

    <!-- History Modal -->
    <div id="historyModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex-col p-4 md:p-6 transition-all duration-300">
        <div class="noc-panel flex flex-col w-full h-full max-w-4xl mx-auto rounded-lg shadow-2xl overflow-hidden border border-var-color" style="background-color: var(--panel-bg)">
            <!-- Modal Header -->
            <div class="flex items-center justify-between p-4 border-b border-var-color shrink-0">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5 text-var-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <h2 class="text-sm font-bold uppercase tracking-wider text-var-main !mb-0">>> RECENT TICKET HISTORY</h2>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="clearTicketHistory()" class="text-[11px] noc-btn px-2.5 py-1 rounded uppercase font-bold text-red-400 border-red-500/30 hover:bg-red-500/20">
                        Clear All
                    </button>
                    <button onclick="closeHistoryModal()" class="text-xs font-bold px-3 py-1 rounded border border-red-500/40 text-red-400 hover:bg-red-500/20 transition-all uppercase">
                        ✕ Close
                    </button>
                </div>
            </div>
            <!-- Modal Body (History List) -->
            <div id="historyListContainer" class="flex-grow p-4 space-y-3 overflow-y-auto" style="background-color: var(--input-bg)">
                <!-- Dynamic Items Rendered Here -->
            </div>
        </div>
    </div>

    <script src="phone-utils.js"></script>
    <script src="speed-calculator.js"></script>
    <script src="history-utils.js"></script>
    <script src="glan.js?v=1.5"></script>
</body>
</html>
