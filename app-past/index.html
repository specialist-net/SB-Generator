<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP Config Generator</title>
    <link rel="icon" href="favicon.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        noc: {
                            bg: '#0a0a0a',
                            panel: '#111111',
                            green: '#00ff9c',
                            greenDim: 'rgba(0, 255, 156, 0.15)',
                            text: '#e0e0e0',
                            textMuted: '#888888'
                        }
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #0a0a0a;
            color: #e0e0e0;
        }

        /* Custom Scrollbar for Hacker Mode */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ff9c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00cc7d;
        }
        
        .noc-panel {
            background-color: #111111;
            border: 1px solid #00ff9c;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        
        .noc-input {
            background-color: #000000;
            border: 1px solid #333333;
            color: #e0e0e0;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        
        .noc-input:focus {
            border-color: #00ff9c;
            outline: none;
            box-shadow: 0 0 0 1px rgba(0, 255, 156, 0.5);
        }
        
        .noc-label {
            color: #00ff9c;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            margin-bottom: 4px;
            display: block;
        }
        
        .tab-btn {
            border: 1px solid transparent;
            border-bottom: 2px solid #333;
            color: #888;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            color: #00ff9c;
            border-bottom: 2px solid #00ff9c;
        }

        /* Toast Animation */
        #toast {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.toast-show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>

<body class="min-h-screen p-4 flex flex-col selection:bg-noc-green selection:text-black">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6 px-2">
        <div>
            <h1 class="text-2xl font-bold text-noc-green uppercase tracking-widest leading-tight">
                ISP Config Generator
            </h1>
            <p class="text-noc-textMuted text-xs tracking-wide">
                <!-- Main vs Infra-TCT toggle logic matches original request -->
                <a href="index.html" class="text-xs text-black bg-noc-green border border-noc-green px-3 py-1 rounded hover:opacity-80 transition-colors uppercase font-bold">
                    APP-MAIN
                </a>
                <a href="../infra-tct.html" class="text-xs text-noc-green border border-noc-green px-3 py-1 rounded hover:bg-noc-green hover:text-black transition-colors uppercase font-bold">
                    INFRA-TCT
                </a>
            </div>
            
            <a id="adminLink" href="admin.html" class="hidden text-xs text-noc-green border border-noc-green px-3 py-1 rounded hover:bg-noc-green hover:text-black transition-colors">
                ADMIN
            </a>
            <button onclick="logout()" class="text-xs text-red-500 border border-red-500 px-3 py-1 rounded hover:bg-red-500 hover:text-black transition-colors">
                LOGOUT
            </button>
            <div class="text-xs text-noc-green animate-pulse flex items-center gap-2 border border-noc-green px-3 py-1 rounded bg-noc-greenDim">
                <div class="w-2 h-2 rounded-full bg-noc-green"></div>
                ONLINE
            </div>
        </div>
    </header>

    <!-- Main 3-Column Grid -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">

        <!-- LEFT PANEL: CUSTOMER INFO -->
        <section class="noc-panel flex flex-col h-full">
            <h2 class="text-noc-green font-bold mb-4 flex items-center gap-2 border-b border-noc-green/30 pb-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                >> CUSTOMER INFO
            </h2>
            
            <div class="mb-4 flex-grow flex flex-col">
                <label class="noc-label">Paste Ticket Data</label>
                <textarea id="customerInput" class="noc-input w-full p-3 text-xs flex-grow resize-none min-h-[150px]"
                    placeholder="Paste customer ticket here..."></textarea>
            </div>

            <div class="bg-black/50 p-3 rounded border border-gray-800 space-y-3">
                <h3 class="noc-label text-noc-textMuted border-b border-gray-800 pb-1 mb-2">Parsed Data Extractor</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] uppercase text-noc-textMuted block mb-1">Customer ID</label>
                        <div id="disp_id" class="text-sm font-bold text-white truncate h-5">--</div>
                    </div>
                    <div>
                        <label class="text-[10px] uppercase text-noc-textMuted block mb-1">Order ID</label>
                        <div id="disp_order" class="text-sm font-bold text-white truncate h-5">--</div>
                    </div>
                    <div class="col-span-2 border-t border-gray-800 pt-2">
                        <label class="text-[10px] uppercase text-noc-textMuted block mb-1">Customer Name</label>
                        <div id="disp_name" class="text-sm font-bold text-white truncate h-5">--</div>
                    </div>
                    <div class="col-span-2">
                        <label class="text-[10px] uppercase text-noc-textMuted block mb-1">Phone</label>
                        <div id="disp_phone" class="text-sm font-bold text-white truncate h-5">--</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- CENTER PANEL: NETWORK CONFIG -->
        <section class="noc-panel flex flex-col h-full">
            <h2 class="text-noc-green font-bold mb-4 flex items-center gap-2 border-b border-noc-green/30 pb-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                >> NETWORK CONFIGURATION
            </h2>

            <div class="space-y-4 flex-grow">
                <div>
                    <label class="noc-label">MAC Address</label>
                    <input type="text" id="macInput" class="noc-input w-full p-2 text-sm uppercase" placeholder="7C:DA:04:AB:CD:EF">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="noc-label">Connection Type</label>
                        <select id="connectionType" class="noc-input w-full p-2 text-sm">
                            <option value="PPPoE">PPPoE (2422)</option>
                            <option value="Static IP">Static IP (2423)</option>
                        </select>
                    </div>
                    <div>
                        <label class="noc-label">Package Type</label>
                        <select id="packageType" class="noc-input w-full p-2 text-sm">
                            <option value="@fiberlink">@fiberlink</option>
                            <option value="@todayhome">@todayhome</option>
                            <option value="@todayfiber">@todayfiber</option>
                            <option value="@todayplus">@todayplus</option>
                            <option value="@sf">@sf</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="noc-label">ONU Interface</label>
                    <div class="flex gap-2">
                        <select id="interfacePrefix" class="noc-input p-2 text-sm shrink-0" onchange="updateInterfaceInput()">
                            <option value="EPON0/1:" selected>EPON0/1:</option>
                            <option value="GPON0/1:">GPON0/1:</option>
                        </select>
                        <input type="text" id="interfaceInput" class="noc-input w-full p-2 text-sm" value="EPON0/1:" placeholder="EPON0/1:36">
                    </div>
                </div>

                <!-- Toggles Container -->
                <div class="pt-4 mt-2 border-t border-gray-800 space-y-3">
                    <!-- IPCAM -->
                    <div class="flex items-center justify-between">
                        <label class="noc-label !mb-0 cursor-pointer" onclick="toggleIpcam()">>> IPCAM_MODE</label>
                        <button id="ipcamToggle" type="button" class="relative w-10 h-5 rounded-full transition-colors duration-300 bg-gray-800 border border-gray-600" onclick="toggleIpcam()">
                            <span id="ipcamDot" class="absolute top-[1px] left-[2px] w-4 h-4 rounded-full transition-all duration-300 bg-gray-500"></span>
                        </button>
                    </div>
                    <div id="ipcamFields" class="hidden grid grid-cols-2 gap-2 bg-black/40 p-2 rounded border border-gray-800">
                        <div>
                            <label class="noc-label">IP Address</label>
                            <input type="text" id="ipInput" class="noc-input w-full p-1.5 text-xs" placeholder="10.168.168.173">
                        </div>
                        <div>
                            <label class="noc-label">Port</label>
                            <input type="text" id="portInput" class="noc-input w-full p-1.5 text-xs" placeholder="8173">
                        </div>
                    </div>

                    <!-- DNS -->
                    <div class="flex items-center justify-between">
                        <label class="noc-label !mb-0 cursor-pointer" onclick="toggleDns()">>> DNS_MODE</label>
                        <button id="dnsToggle" type="button" class="relative w-10 h-5 rounded-full transition-colors duration-300 bg-gray-800 border border-gray-600" onclick="toggleDns()">
                            <span id="dnsDot" class="absolute top-[1px] left-[2px] w-4 h-4 rounded-full transition-all duration-300 bg-gray-500"></span>
                        </button>
                    </div>

                    <!-- SPEED CALCULATOR -->
                    <div class="flex items-center justify-between">
                        <label class="noc-label !mb-0 cursor-pointer" onclick="toggleSpeed()">>> SPEED_CALCULATOR</label>
                        <button id="speedToggle" type="button" class="relative w-10 h-5 rounded-full transition-colors duration-300 bg-gray-800 border border-gray-600" onclick="toggleSpeed()">
                            <span id="speedDot" class="absolute top-[1px] left-[2px] w-4 h-4 rounded-full transition-all duration-300 bg-gray-500"></span>
                        </button>
                    </div>
                    <div id="speedCalculatorFields" class="hidden bg-black/40 p-2 rounded border border-gray-800">
                        <label class="noc-label">Speed (Mbps)</label>
                        <input type="number" id="speedInput" class="noc-input w-full p-1.5 text-xs mb-2" placeholder="e.g. 50" oninput="calculateSpeed()">
                        <input type="text" id="speedOutput" readonly onclick="this.select(); document.execCommand('copy');" class="w-full text-[11px] font-mono bg-transparent border-0 text-noc-green focus:outline-none" placeholder="Awaiting input...">
                    </div>
                </div>
            </div>
        </section>

        <!-- RIGHT PANEL: OUTPUT -->
        <section class="noc-panel flex flex-col h-full gap-4 overflow-y-auto">
            
            <!-- Output 1 -->
            <div class="flex flex-col h-[200px] shrink-0">
                <div class="flex justify-between items-center mb-1">
                    <label class="noc-label !mb-0">>> USER_INFO_OUTPUT</label>
                    <button onclick="copyOutput('output_userInfo', this)" class="text-[10px] px-2 py-1 flex items-center gap-1 font-mono uppercase bg-noc-green/10 hover:bg-noc-green/20 text-noc-green border border-noc-green/50 rounded transition-colors">
                        COPY
                    </button>
                </div>
                <textarea id="output_userInfo" readonly onclick="this.select();" class="noc-input w-full flex-grow p-3 text-xs resize-none" placeholder="User Information will appear here..."></textarea>
            </div>

            <!-- Output 2 -->
            <div class="flex flex-col h-[200px] shrink-0">
                <div class="flex justify-between items-center mb-1">
                    <label class="noc-label !mb-0">>> COMMAND_LINE_OUTPUT</label>
                    <button onclick="copyOutput('output_commandOut', this)" class="text-[10px] px-2 py-1 flex items-center gap-1 font-mono uppercase bg-noc-green/10 hover:bg-noc-green/20 text-noc-green border border-noc-green/50 rounded transition-colors">
                        COPY
                    </button>
                </div>
                <textarea id="output_commandOut" readonly onclick="this.select();" class="noc-input w-full flex-grow p-3 text-xs resize-none" placeholder="Command Lines will appear here..."></textarea>
            </div>

            <!-- Output 3 -->
            <div class="flex flex-col h-[200px] shrink-0">
                <div class="flex justify-between items-center mb-1">
                    <label class="noc-label !mb-0">>> TO_TCT_GROUP</label>
                    <button onclick="copyOutput('output_tctGroup', this)" class="text-[10px] px-2 py-1 flex items-center gap-1 font-mono uppercase bg-noc-green/10 hover:bg-noc-green/20 text-noc-green border border-noc-green/50 rounded transition-colors">
                        COPY
                    </button>
                </div>
                <textarea id="output_tctGroup" readonly onclick="this.select();" class="noc-input w-full flex-grow p-3 text-xs resize-none" placeholder="TCT Group format will appear here..."></textarea>
            </div>
            
        </section>

    </main>

    <!-- Bottom Action Bar -->
    <div class="mt-6 flex justify-center items-center gap-6 mb-2">
        <button onclick="generateConfig()" class="bg-noc-green text-black font-bold py-3 px-8 rounded-lg shadow-[0_0_15px_rgba(0,255,156,0.3)] hover:shadow-[0_0_25px_rgba(0,255,156,0.5)] transition-all uppercase tracking-widest flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            GENERATE CONFIG
        </button>
        <button onclick="resetAll()" class="text-noc-textMuted hover:text-white border border-gray-700 hover:border-gray-500 font-bold py-3 px-6 rounded-lg transition-all uppercase tracking-widest text-sm">
            RESET
        </button>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-noc-green text-black font-bold px-4 py-2 rounded shadow-lg flex items-center gap-2 z-50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        DATA COPIED TO CLIPBOARD
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        checkAuth(async (user) => {
            const isAdmin = await checkAdmin(user);
            if (isAdmin) {
                document.getElementById('adminLink').classList.remove('hidden');
            }
        });
    </script>
    <script src="script.js?v=3.0"></script>
</body>

</html>
